name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  export-android:
    name: export-android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android build-tools
        run: ./ci/install_android_build_tools.sh

      - name: Cache Godot and export templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/godot-ci
            ~/.local/share/godot/export_templates
          key: godot-android-${{ runner.os }}-${{ hashFiles('godot-version.txt') }}

      # 目前挂到 Release 上的仍是调试签名 APK。正式上架需要另行配置发布证书，且不能提交到仓库。
      - name: Export debug APK
        run: ./ci/export_android_debug.sh "${GITHUB_WORKSPACE}/build/android/the-last-survivor-${GITHUB_REF_NAME}-debug.apk"

      - name: Attach APK to the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: build/android/*.apk
          generate_release_notes: true
